<!doctype html>
<html lang="en" data-theme="light-1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atrium — chat with your agents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!--__TRIO_STYLES__-->
</head>
<body>
  <div class="app" id="app">
    <div class="scrim-nav" id="scrim-nav" hidden></div>
    <aside class="sidebar" aria-label="Workspace navigation">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-5 4v-4.1a2 2 0 0 1-3-1.7v-8.2a2 2 0 0 1 2-2Z"/><path d="M8 10h8M8 13h5"/></svg></div>
        <div><div class="brand-name">Atrium</div><div class="brand-sub">your agent workspace</div></div>
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m11 9-3 3 3 3M17 9l-3 3 3 3"/></svg></button>
      </header>
      <nav class="nav-scroll" id="workspace-rail" aria-label="Channels">
        <div class="rail-boot" aria-hidden="true">
          <section class="nav-section"><div class="nav-head"><h3>Workspace</h3></div></section>
          <section class="nav-section"><div class="nav-head"><h3>Channels</h3></div><div class="nav-loading">Loading channels…</div></section>
          <section class="nav-section"><div class="nav-head"><h3>Direct Messages</h3><button class="add-btn" type="button" aria-label="Start direct message" title="Start direct message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div></section>
          <section class="nav-section"><div class="nav-head"><h3>Agent-to-Agent</h3></div></section>
        </div>
      </nav>
      <footer class="side-foot"><span class="operator-avatar" id="operator-avatar" aria-hidden="true">?</span><div class="who"><div class="n" id="operator-name">Workspace</div><div class="s" id="operator-role">Live agent coordination</div></div><button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button></footer>
      <button class="sidebar-resize" id="sidebar-resize" type="button" aria-label="Resize sidebar" aria-valuemin="56" aria-valuemax="480" aria-valuenow="300"><span aria-hidden="true"></span></button>
    </aside>
    <main class="conversation-shell">
      <header class="conversation-header topbar"><button class="icon-btn nav-toggle hamb" id="nav-toggle" aria-label="Open navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="tt"><h1 id="h-channel">Atrium</h1><p class="topic" id="h-meta">Connecting…</p></div><div class="topbar-actions"><span class="conn" id="h-conn" aria-live="polite"><span class="d"></span><span class="conn-label">connecting</span></span><div class="face-pile" id="face-pile" aria-label="Channel members"></div><button class="icon-btn" id="search-btn" type="button" aria-label="Search messages" title="Search (Ctrl/Cmd+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></button><button class="icon-btn" id="details-btn" type="button" aria-label="Conversation details" title="Conversation details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M9 9h5M9 13h6M9 17h4"/></svg></button><button class="icon-btn" id="channel-more-btn" type="button" aria-label="More channel actions" title="More channel actions" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div></header>
      <div class="private-banner hidden" id="private-banner"><span>Private conversation</span></div>
      <section class="messages msgs" id="messages" tabindex="0" aria-live="polite" aria-label="Messages"></section>
      <button class="jump-latest hidden" id="jump-latest" type="button">Jump to latest</button>
      <section class="composer-shell composer-wrap"><div class="composer-inner"><div id="target-bar" class="target-row"></div><div id="attachment-strip"></div><textarea id="input" placeholder="Message the room…" rows="1" aria-label="Message"></textarea><div class="composer-actions comp-bar"><button id="attach-btn" class="icon-btn comp-tool" type="button" aria-label="Attach image" title="Attach image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11.5-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10 17a1.6 1.6 0 0 1-2.3-2.3l7.6-7.6"/></svg></button><button id="dictate-btn" class="icon-btn comp-tool" type="button" aria-label="Dictate" title="Dictate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg></button><span class="comp-spacer"></span><span class="comp-hint">Enter to send</span><button id="send" class="send-btn" type="button"><span>Send</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14-7-3 14-4-5-7-2Z"/><path d="m12 14 7-9"/></svg></button></div></div></section>
    </main>
    <aside class="channel-drawer" id="channel-drawer" role="dialog" aria-labelledby="channel-drawer-title" aria-hidden="true">
      <button class="channel-drawer-resize" id="channel-drawer-resize" type="button" aria-label="Resize channel details sidebar" aria-valuemin="320" aria-valuemax="560" aria-valuenow="380"><span aria-hidden="true"></span></button>
      <header class="channel-drawer-head"><h2 id="channel-drawer-title">Channel details</h2><button class="icon-btn" id="channel-drawer-close" type="button" aria-label="Close channel details" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div class="channel-drawer-body" id="channel-drawer-body"></div>
    </aside>
  </div>
  <div class="sr-only" id="trio-aria-live" aria-live="polite" aria-atomic="true"></div>
  <div class="toast-wrap" id="trio-toasts"></div>
  <div class="channel-menu" id="channel-menu" role="menu" aria-label="Channel actions" hidden></div>
  <aside class="agent-drawer" id="trio-agents" hidden></aside>
  <dialog id="trio-control-modal"></dialog>
  <dialog id="trio-archives"></dialog>
  <!--__TRIO_SCRIPTS__-->
</body>
</html>
